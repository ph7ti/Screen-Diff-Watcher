name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
        include:
          # macOS entra so no 3.13 (runner arm64); offscreen na celula de testes.
          - os: macos-latest
            python: "3.13"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        if: runner.os == 'Linux' && matrix.python == '3.13'
        run: python -m mypy

      - name: Validate i18n catalogs
        run: python -m screen_watch validate-i18n

      - name: Tests (Linux)
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a python -m pytest -q -m "not integration" --cov=screen_watch --cov-report=term-missing --cov-report=xml 2>&1 | tee pytest.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            # Log do job exige login; anotacoes sao publicas.
            {
              grep -E "^(FAILED|ERROR) " pytest.log | head -n 10
              awk '/=+ FAILURES =+/{flag=1} flag{print; n++} n>=30{exit}' pytest.log
            } | sed 's/%/%25/g; s/\r$//' | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit "$code"
          fi

      - name: Tests (Windows)
        if: runner.os == 'Windows'
        run: python -m pytest -q -m "not integration" --cov=screen_watch --cov-report=term-missing --cov-report=xml

      - name: Tests (macOS)
        if: runner.os == 'macOS'
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q -m "not integration" --cov=screen_watch --cov-report=term-missing --cov-report=xml

      - name: Upload coverage artifact
        if: runner.os == 'Linux' && matrix.python == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  package:
    name: package (${{ matrix.os }})
    if: github.event_name == 'pull_request'
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: --linux
          - os: windows-latest
            target: --windows
          - os: macos-latest
            target: --macos

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[build,input]"

      - name: Install (macOS popup dependency)
        if: runner.os == 'macOS'
        run: pip install -e ".[macosx]"

      - name: Inno Setup
        if: runner.os == 'Windows'
        run: choco install innosetup -y

      - name: Build installer
        run: python scripts/build_release.py ${{ matrix.target }}

      - name: Smoke (Linux)
        if: runner.os == 'Linux'
        run: |
          dist/screen-watch/screen-watch --help
          xvfb-run -a dist/screen-watch/screen-watch features --json

      - name: Smoke (Windows)
        if: runner.os == 'Windows'
        run: |
          dist\screen-watch\screen-watch.exe --help
          dist\screen-watch\screen-watch.exe features --json

      - name: Smoke (macOS)
        if: runner.os == 'macOS'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          dist/screen-watch/screen-watch --help
          dist/screen-watch/screen-watch features --json

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ runner.os }}
          path: dist/installers/*
