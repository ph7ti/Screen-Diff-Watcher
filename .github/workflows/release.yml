name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Versao a validar (igual a screen_watch.__version__), ex.: 0.2.0-rc1"
        required: true
        type: string

permissions:
  contents: write

jobs:
  windows:
    name: windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Guarda de versao
        shell: bash
        env:
          REF_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          python - <<'PY'
          import os, sys
          sys.path.insert(0, "src")
          import screen_watch
          expected = screen_watch.__version__
          ref = os.environ["REF_VERSION"].strip()
          if ref.startswith("v"):
              ref = ref[1:]
          if ref != expected:
              print(f"::error::ref {ref!r} != screen_watch.__version__ {expected!r}")
              raise SystemExit(1)
          print(f"versao ok: {expected}")
          PY

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,build,input]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests
        run: python -m pytest -q -m "not integration"

      - name: Inno Setup
        run: choco install innosetup -y

      - name: Build installer
        run: python scripts/build_release.py --windows

      - name: Smoke
        run: |
          dist\screen-watch\screen-watch.exe --help
          dist\screen-watch\screen-watch.exe features --json

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/installers/*

  linux:
    name: linux package
    runs-on: ubuntu-latest
    container:
      image: ubuntu:22.04
    steps:
      - name: System deps
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl git python3 python3-venv xz-utils dpkg-dev xvfb xauth \
            libgl1 libegl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 libglib2.0-0 \
            libfontconfig1 libfreetype6 libx11-6 libxext6 libxrender1 \
            libxcb1 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-shm0 \
            libxcb-sync1 libxcb-xfixes0 libxcb-xinerama0

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Guarda de versao
        env:
          REF_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          python - <<'PY'
          import os, sys
          sys.path.insert(0, "src")
          import screen_watch
          expected = screen_watch.__version__
          ref = os.environ["REF_VERSION"].strip()
          if ref.startswith("v"):
              ref = ref[1:]
          if ref != expected:
              print(f"::error::ref {ref!r} != screen_watch.__version__ {expected!r}")
              raise SystemExit(1)
          print(f"versao ok: {expected}")
          PY

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,build,input]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests
        run: xvfb-run -a python -m pytest -q -m "not integration"

      - name: Build installer
        run: python scripts/build_release.py --linux

      - name: Smoke
        run: |
          dist/screen-watch/screen-watch --help
          xvfb-run -a dist/screen-watch/screen-watch features --json

      - uses: actions/upload-artifact@v4
        with:
          name: linux-package
          path: dist/installers/*

  release:
    name: publish release
    needs: [windows, linux]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        shell: bash
        run: |
          cd artifacts
          find . -type f -not -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          # Notas do release = secao da versao no CHANGELOG.md (presente no checkout).
          VERSION="${TAG#v}"
          NOTES="$(awk -v ver="$VERSION" '
            BEGIN { header = "## [" ver "]" }
            index($0, header) == 1 { found = 1 }
            found && /^## \[/ && index($0, header) != 1 { found = 0 }
            found { print }
          ' CHANGELOG.md)"
          if [ -z "$NOTES" ]; then
            NOTES="$(git tag -l --format='%(contents)' "$TAG" 2>/dev/null || true)"
          fi
          if [ -z "$NOTES" ]; then
            NOTES="Release $TAG. Instaladores: Windows (setup.exe) e Linux (.deb). Checksums em SHA256SUMS.txt."
          fi
          gh release create "$TAG" artifacts/* --title "$TAG" --notes "$NOTES"
