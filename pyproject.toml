[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "screen-watch"
dynamic = ["version"]
description = "Monitor a rectangular region of a desktop window and alert on visual changes."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mss>=9.0",
    "numpy>=1.26",
    "pywinctl>=0.3",
    "Pillow>=10.0",
    "ImageHash>=4.3",
    "pytesseract>=0.3.10",
    "PyQt6>=6.6",
    "pystray>=0.19",
    "plyer>=2.1",
    "httpx>=0.27",
    "PyYAML>=6.0",
    # Audio no CLI/`run` (sem aplicacao Qt): WAV/MP3/OGG/FLAC em thread daemon.
    "miniaudio>=1.61",
]

[project.optional-dependencies]
# simpleaudio has no reliable wheel for Python 3.13 yet; keep it optional so the
# core installs cleanly. Sound simply stays disabled when the import fails.
sound = ["simpleaudio>=1.0.4"]
input = ["pynput>=1.7"]
ocr-preproc = ["opencv-python>=4.8"]
logging = ["structlog>=24.1"]
# Canal de alerta MQTT (v0.9.0); opcional, nao entra nos instaladores.
mqtt = ["paho-mqtt>=2.1"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff==0.16.9"]
# PyInstaller so passou a suportar Python 3.13 a partir do 6.11.1.
build = ["pyinstaller>=6.11.1"]

[project.scripts]
screen-watch = "screen_watch.__main__:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
screen_watch = ["py.typed", "assets/icons/*.png", "assets/sounds/*.mp3", "i18n/*.json"]

[tool.setuptools.dynamic]
# Fonte unica da versao: screen_watch/__init__.py::__version__.
version = { attr = "screen_watch.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: testes reais opt-in (display/rede); excluidos do CI com -m 'not integration'",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I", "UP"]
# UP037: anotacoes entre aspas sao intencionais com `from __future__ import annotations`
# e referencias so existentes em TYPE_CHECKING (ex.: WindowInfo).
ignore = ["UP037"]
